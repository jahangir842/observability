services:

  # 🧠 Prometheus for scraping vLLM metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-admin-api'        # ✅ Enables delete API
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring-network
    restart: unless-stopped

  # 📊 Grafana for dashboard visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      # - ./monitoring/grafana:/etc/grafana/provisioning:ro # for provisioning datasources and dashboards (read-only config files)
      - grafana_data:/var/lib/grafana # persistent storage including dashboards and user data like grafana.db
    networks:
      - monitoring-network
    depends_on:
      - prometheus
    restart: unless-stopped

    # To reset Grafana admin password, exec into the grafana container and run:
    # docker exec -it grafana grafana-cli admin reset-admin-password admin123

  # Loki for log aggregation and visualization
  loki:
    image: grafana/loki:main-397da27
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./logging/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-network
  
  # Promtail for shipping logs to Loki
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ./logging/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - monitoring-network

volumes:
  prometheus_data:
  grafana_data:
  loki-data:

networks:
  monitoring-network:
    driver: bridge
